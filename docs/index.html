<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>swipe-decide</title>
<meta name="description" content="区切った項目を1枚ずつスワイプで いいね・却下・保留 に振り分ける">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="app">

  <!-- 入力画面 -->
  <section id="view-input" hidden>
    <h1>swipe-decide</h1>
    <p class="lead">「、」「,」改行で区切った項目を1枚ずつ振り分けます。右でいいね、左で却下、下で保留。</p>
    <label class="field">
      <span>タイトル（任意）</span>
      <input id="in-title" type="text" placeholder="例: 昼ごはん" autocomplete="off">
    </label>
    <label class="field">
      <span>項目</span>
      <textarea id="in-items" rows="7" placeholder="ラーメン、カレー、寿司&#10;うどん"></textarea>
    </label>
    <p id="in-count" class="muted"></p>
    <div class="row">
      <button id="btn-start" class="primary" type="button" disabled>始める</button>
    </div>
    <p class="muted small">URL だけで一覧を渡す決まりは <a href="skill.md">/skill.md</a> にあります。</p>
  </section>

  <!-- スワイプ画面 -->
  <section id="view-swipe" hidden>
    <header class="bar">
      <h2 id="sw-title"></h2>
      <span id="sw-progress" class="muted"></span>
    </header>
    <div id="stack" class="stack" aria-live="polite"></div>
    <div class="actions">
      <button id="btn-nope" class="act nope" type="button" aria-label="却下（左）"><span class="key">←</span>却下</button>
      <button id="btn-hold" class="act hold" type="button" aria-label="保留（下）"><span class="key">↓</span>保留</button>
      <button id="btn-like" class="act like" type="button" aria-label="いいね（右）">いいね<span class="key">→</span></button>
    </div>
    <div class="row center">
      <button id="btn-undo" class="ghost" type="button" disabled>1件戻す</button>
    </div>
  </section>

  <!-- 結果画面 -->
  <section id="view-result" hidden>
    <header class="bar">
      <h2 id="rs-title"></h2>
      <span class="muted">結果</span>
    </header>
    <div id="rs-groups"></div>
    <label class="field">
      <span>貼り戻し用テキスト</span>
      <textarea id="rs-text" rows="5" readonly></textarea>
    </label>
    <div class="row">
      <button id="btn-copy" class="primary" type="button">コピー</button>
      <button id="btn-share" type="button" hidden>共有</button>
    </div>
    <div class="row">
      <button id="btn-undo2" class="ghost" type="button">1件戻す</button>
      <button id="btn-rehold" class="ghost" type="button" hidden>保留だけもう一度</button>
      <button id="btn-restart" class="ghost" type="button">最初から</button>
      <a class="ghost-link" href="./">新しく作る</a>
    </div>
  </section>

</main>
<div id="toast" class="toast" role="status" hidden></div>
<script src="app.js"></script>
</body>
</html>
